/* V2: Performance command center for the main administrator */
.perf-filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:12px 15px;border:1px solid #e9eef7;border-radius:15px;margin-bottom:17px;box-shadow:var(--shadow)}
.perf-filterbar .perf-filter-label{color:#51617b;font-weight:800;font-size:11px;display:flex;align-items:center;gap:7px;margin-left:4px}
.perf-filterbar select{min-width:168px;max-width:240px;flex:1;border:1px solid #e1e8f3;background:#f7f9fd;border-radius:10px;color:#344967;padding:10px 12px}
.perf-filterbar .btn{margin-right:auto}
.perf-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 18px}

.perf-kpi:before{position:absolute;content:"";height:87px;width:87px;left:-26px;top:-28px;border-radius:50%;background:var(--perf-soft)}
.perf-kpi-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.perf-kpi-head .perf-kpi-icon{height:42px;width:42px;border-radius:13px;display:grid;place-items:center;background:var(--perf-soft);color:var(--perf-hue)}
.perf-kpi .perf-kpi-value{font-size:31px;font-weight:900;line-height:1.3;margin:12px 0 4px;letter-spacing:-.5px}

function calendarAgendaForDay(rows,iso){
 // وظایف عادی و نوبت‌های ایجادشده هر دو در تقویم نشان داده می‌شوند.
 const items=D.tasks.filter(t=>t.due===iso&&canSeeTask(t)).map(t=>({kind:'saved',task:t}));
 for(const r of rows){
  if(!['active','pending'].includes(r.state)||iso<r.start||(r.end&&iso>r.end)||!rShould(r,iso))continue;
  // اگر وثوق یک نوبت را حذف کرده، تقویم آن را دوباره به‌صورت فرضی نمایش ندهد.
  if((r.excluded||[]).includes(iso))continue;
  // اگر برای همین برنامه و تاریخ نوبت ثبت شده، نمایش دوباره ممنوع است.
  if(items.some(a=>a.task?.seriesId===r.id))continue;
  items.push({kind:r.state==='pending'?'pending':'scheduled',recurrence:r});
 }
 return items;
}
function renderMonthGrid(rows){
 const {y,m}=shiftedJMonth(U.calendarOffset),key=`${y}/${pad(m)}`,last=daysInMonth(y,m),today=isoToday(),lead=wd(fromJ(y,m,1));

 for(let d=1;d<=last;d++){
  const iso=fromJ(y,m,d),items=calendarAgendaForDay(rows,iso),amount=items.length;

 }
 const agenda=calendarAgendaForDay(rows,selected);
 const agendaHtml=agenda.map(item=>{

   return `<button type="button" class="day-agenda-item day-agenda-link" data-action="task-detail" data-id="${esc(t.id)}"><b>${esc(t.title)}</b><div class="hint">${esc(projectName(t.projectId))} · ${esc(actorName(t.assignee))}</div><div class="calendar-agenda-tags">${pill(taskStatus(t),statusColor[t.status]||'gray')}${pill(t.seriesId?'نوبت تکراری':'فعالیت عادی','blue')}</div></button>`;
  }

  return `<div class="day-agenda-item"><b>${esc(r.title)}</b><div class="hint">${esc(projectName(r.projectId))} · ${esc(actorName(r.assignee))}</div><div class="calendar-agenda-tags">${pill(pending?'در انتظار تأیید برنامه':'برنامه‌ریزی‌شده',pending?'amber':'blue')}${pill(recurrenceLabel(r),'gray')}</div><div class="hint">${pending?'پس از تأیید آقای وثوق، نوبت‌ها طبق برنامه ایجاد می‌شوند.':'این نوبت مربوط به برنامه تکراری است؛ در موعد مقرر به فهرست کارها اضافه می‌شود.'}</div></div>`;
 }).join('');
 return `<div class="month-layout"><div><div class="month-weekdays">${DW.map(x=>`<span>${x}</span>`).join('')}</div><div class="month-days">${ts.join('')}</div></div><div class="day-agenda" aria-live="polite"><div class="calendar-agenda-heading"><b>فعالیت‌های ${jstr(selected)}</b>${pill(num(agenda.length)+' مورد',agenda.length?'blue':'gray')}</div>${agenda.length?agendaHtml:'<div class="hint" style="margin-top:20px">هیچ فعالیت یا نوبت برنامه‌ریزی‌شده‌ای در این تاریخ وجود ندارد.</div>'}</div></div>`
}

function panelsPage(){return `${heading('پنل‌ها','آقای وثوق می‌تواند برای آزمون هر نقش وارد شود. کارکنان فقط فعالیت‌های خودشان را می‌بینند.')}<div class="notice" style="margin-bottom:20px">${icon('lock',17)} شبیه‌ساز پنل‌ها فعال است، ولی هر نقش فقط کارهای ثبت‌شده توسط خودش یا ارجاع‌شده به خودش را می‌بیند؛ نه کار هم‌پروژه‌ای‌ها و نه کارهای خصوصی آقای وثوق.</div><div class="roles-grid">${Object.entries(roles).map(([k,name])=>{const users=D.users.filter(u=>u.active&&u.role===k);return `<div class="role-card"><div class="role-icon">${icon(roleIcon[k],25)}</div><h3>پنل ${name}</h3><p>${k==='supervisor'?'پیگیری فعالیت‌های خود و کارهای ارجاع‌شده':k==='senior'?'انجام کارهای تخصصی و گزارش‌دهی':k==='expert'?'ثبت فعالیت، تغییر وضعیت و ارسال خروجی':'ثبت کارهای آموزشی و گزارش فعالیت'}</p><div class="hint">${num(users.length)} کاربر فعال با این سمت</div><button class="btn primary full" data-action="open-role" data-id="${k}">${icon('eye',15)} ورود و کار با پنل</button></div>`}).join('')}</div>`}
function scoreOf(t){return D.evaluations.find(e=>e.id===t.evalId)||null}
function periodStats(personId,monthKey,projectKey='all'){const all=D.tasks.filter(t=>!managerTask(t)&&personId!==MANAGER_ID&&t.assignee===personId&&t.due&&jyMonth(t.due)===monthKey&&t.due<=isoToday()&&(projectKey==='all'||t.projectId===projectKey));const w=t=>+t.weight||1;const total=all.reduce((a,t)=>a+w(t),0),done=all.filter(t=>t.status==='done'),wDone=done.reduce((a,t)=>a+w(t),0);const graded=done.filter(t=>scoreOf(t));const wg=graded.reduce((a,t)=>a+w(t),0);const quality=wg?graded.reduce((a,t)=>a+scoreOf(t).quality*20*w(t),0)/wg:null;const time=wg?graded.reduce((a,t)=>a+scoreOf(t).timing*w(t),0)/wg:null;const volume=total?pct(wDone,total):null;const final=quality!==null&&time!==null&&volume!==null?Math.round(quality*.5+time*.3+volume*.2):null;return {count:all.length,done:done.length,total,weightDone:wDone,quality,time,volume,final}}

ction class="panel"><div class="panel-title"><h2>مقایسه عملکرد افراد</h2><small>امتیاز نهایی ماه</small></div>${scoped.length?scoped.map(u=>`<div class="person-chart-row"><div class="row-flex between"><b>${esc(u.name)}</b><span>${u.stats.final===null?'در انتظار ارزیابی':num(u.stats.final)+' / ۱۰۰'}</span></div><div class="progress"><span style="width:${u.stats.final??0}%;background:${u.stats.final>=80?'#13a48e':u.stats.final>=60?'#3675ed':'#e6a849'}"></span></div><div class="hint">${roles[u.role]} · ${num(u.stats.done)} از ${num(u.stats.count)} فعالیت</div><button class="link-button" data-action="person-detail" data-id="${u.id}">پرونده عملکرد</button></div>`).join(''):empty('هنوز داده عملکردی وجود ندارد','بعد از ثبت فعالیت در یکی از پنل‌ها، نتیجه اینجا نمایش داده می‌شود.')}</section><section class="panel"><div class="panel-title"><h2>وضعیت فعالیت‌ها</h2></div>${donut(countStatuses(dueTasks),dueTasks.length)}<div class="notice" style="margin-top:15px">امتیاز دوره‌ای = کیفیت ۵۰٪ + زمان ۳۰٪ + حجم کار تأییدشده ۲۰٪؛ محاسبه فقط پس از ثبت ارزیابی معتبر انجام می‌شود.</div></section></div><section class="panel" style="margin-top:18px"><div class="panel-title"><h2>گزارش نفر به نفر</h2></div>${scoped.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>نام</th><th>سمت</th><th>کار انجام‌شده / کل</th><th>کیفیت</th><th>زمان</th><th>حجم</th><th>امتیاز نهایی</th></tr></thead><tbody>${scoped.map(u=>`<tr><td>${esc(u.name)}</td><td>${roles[u.role]}</td><td>${num(u.stats.done)} / ${num(u.stats.count)}</td><td>${u.stats.quality===null?'—':num(Math.round(u.stats.quality))}</td><td>${u.stats.time===null?'—':num(Math.round(u.stats.time))}</td><td>${num(Math.round(u.stats.volume??0))}٪</td><td><strong>${u.stats.final===null?'—':num(u.stats.final)}</strong></td></tr>`).join('')}</tbody></table></div>`:empty('هیچ داده‌ای برای این ماه وجود ندارد')}</section>`}

function rShould(r,iso){
 const j=jparts(iso);if(!j)return false;const weekday=wd(iso);
 if(r.frequency==='daily')return !r.workOnly||weekday!==6;
 if(r.frequency==='weekly')return weekday===Number(r.weekday); // روز انتخابی دقیقاً رعایت می‌شود
 if(r.frequency==='monthly'){
  let dt=r.monthDay==='lastWork'?daysInMonth(j.y,j.m):Math.min(daysInMonth(j.y,j.m),Number(r.monthDay)||1);
  if(r.workOnly||r.monthDay==='lastWork')while(dt>1&&wd(fromJ(j.y,j.m,dt))===6)dt--;
  return j.d===dt;
 }
 return false
}
function createInstance(r,iso,manual=false){const k=manual?'manual:'+id('x'):iso;if(D.tasks.some(t=>t.seriesId===r.id&&t.occurrenceKey===k)||(r.excluded||[]).includes(k))return null;const t={id:id('t'),title:r.title,projectId:r.projectId||'',assignee:r.assignee,createdBy:r.createdBy,createdAt:isoToday(),updatedAt:new Date().toISOString(),due:iso,priority:'normal',weight:managerRecurring(r)?0:(r.weight||3),visibility:managerRecurring(r)?'manager_private':'team',status:'todo',description:r.description||'',notes:[],seriesId:r.id,occurrenceKey:k,submittedAt:null,evalId:null};D.tasks.push(t);record('new','ایجاد نوبت تکراری: '+t.title,t.id);return t}
function generateDue(){let created=0,today=isoToday();for(const r of D.recurrences){if(r.state!=='active')continue;let cur=r.start>addDays(today,-75)?r.start:addDays(today,-75),finish=r.end&&r.end<today?r.end:today;let max=0;while(cur<=finish&&max++<90){if(rShould(r,cur)){const res=createInstance(r,cur);if(res)created++}cur=addDays(cur,1)}}if(created)persist();return created}

function updateTask(fd){const old=D.tasks.find(t=>t.id===U.edit),edit=!!old,title=String(fd.get('title')||'').trim(),due=jparse(fd.get('dueJ'));if(!title||!due)return toast('عنوان و تاریخ شمسی معتبر وارد کنید.',true);const projectId=String(fd.get('projectId')||''),assignee=String(fd.get('assignee')||(!isAdmin()?U.actor:'demo:expert'));if(projectId&&!proj(projectId))return toast('پروژه انتخاب‌شده معتبر نیست.',true);if(!isAdmin()&&(assignee===MANAGER_ID||!availableProject(projectId)||(!permission('assign')&&assignee!==U.actor)))return toast('شما مجوز انتخاب این مسئول یا پروژه را ندارید.',true);if(assignee!==MANAGER_ID&&assignee&&!assignee.startsWith('demo:')&&!person(assignee))return toast('مسئول نامعتبر است.',true);if(projectId&&assignee!==MANAGER_ID&&!assignee.startsWith('demo:')&&!person(assignee)?.projects.includes(projectId))return toast('ابتدا دسترسی این کاربر به پروژه را از مدیریت کاربران فعال کنید.',true);if(edit&&isAdmin()){const desired=String(fd.get('status')||old.status);if(!Object.hasOwn(statuses,desired))return toast('وضعیت نامعتبر است.',true);if(desired==='blocked'&&!String(fd.get('blockReason')||'').trim())return toast('برای توقف فعالیت، دلیل توقف اجباری است.',true)}

function updateGrade(fd){const t=D.tasks.find(t=>t.id===U.edit);if(!t||!isAdmin()||managerTask(t))return toast('کارهای شخصی مدیر کنترل پروژه مشمول ارزیابی نیستند.',true);const delivered=jparse(fd.get('deliveredJ'));if(!delivered)return toast('تاریخ تحویل شمسی معتبر نیست.',true);const qual=Math.max(1,Math.min(5,+fd.get('quality'))),complete=Math.max(1,Math.min(5,+fd.get('complete'))),excused=fd.has('excused');const late=Math.max(0,Math.round((Date.parse(delivered+'T12:00:00Z')-Date.parse(t.due+'T12:00:00Z'))/86400000));const timing=excused?100:Math.max(0,100-late*15);const score=Math.round(qual*10+complete*4+timing*.3);const ev={id:id('ev'),taskId:t.id,assignee:t.assignee,projectId:t.projectId,quality:qual,complete,timing,score,excused,deliveredAt:delivered,date:isoToday(),at:new Date().toISOString(),feedback:String(fd.get('feedback')||''),previousId:t.evalId||null};D.evaluations.push(ev);t.evalId=ev.id;t.status='done';t.submittedAt=delivered;t.updatedAt=new Date().toISOString();record('grade','وثوق امتیاز '+score+' از ۱۰۰ را ثبت کرد',t.id);closeModal();save(`امتیاز ${num(score)} از ۱۰۰ ثبت شد.`)}

document.addEventListener('input',e=>{if(e.target.id==='task-query'){let text=e.target.value,pos=e.target.selectionStart;U.filterText=text;render();const target=$('#task-query');if(target){target.focus();target.setSelectionRange(pos,pos)}}});
document.addEventListener('submit',e=>{const f=e.target;if(!modalForms.has(f.id))return;e.preventDefault();const fd=new FormData(f);if(f.id==='form-task')return updateTask(fd);if(f.id==='form-project')return updateProject(fd);if(f.id==='form-user')return updateUser(fd);if(f.id==='form-recurring')return updateRecurring(fd);if(f.id==='form-grade')return updateGrade(fd);if(f.id==='form-request'){const name=String(fd.get('name')||'').trim(),email=String(fd.get('email')||'').trim().toLowerCase();if(!name||!email.includes('@'))return toast('نام و ایمیل معتبر ضروری است.',true);if([...D.users,...D.requests].some(u=>u.email===email))return toast('ایمیل تکراری است.',true);D.requests.push({id:id('req'),name,email,date:isoToday()});record('user','درخواست عضویت '+email);closeModal();save('درخواست ثبت شد و در بخش کاربران وثوق قابل مشاهده است.');return}if(f.id==='form-note'){const t=D.tasks.find(x=>x.id===U.edit),note=String(fd.get('note')||'').trim();if(!t||!note)return;if(!isAdmin()&&!canSeeTask(t))return;if(!t.notes)t.notes=[];t.notes.push({text:note,by:isAdmin()?'وثوق':actorName(U.actor),date:isoToday()});record('note','افزودن یادداشت',t.id);persist();renderModal();toast('یادداشت ثبت شد.');return}});
$('#restore-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.version!==4||!Array.isArray(d.tasks)||!Array.isArray(d.projects)||!Array.isArray(d.users)||!Array.isArray(d.recurrences)||!Array.isArray(d.evaluations)||!d.permissions)throw Error();if(!confirm('پشتیبان بازیابی شود و همه داده‌های فعلی این مرورگر جایگزین شوند؟'))return;D=d;U.preview=null;U.page='dashboard';generateDue();save('داده‌های پشتیبان بازیابی شدند.')}catch(er){toast('پشتیبان معتبر نیست.',true)}finally{e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#date-popup')?.style.display==='block')$('#date-popup').style.display='none';else if(U.modal)closeModal()}});
let dpTarget=null,dpMonth=null;
function openCalendar(name){dpTarget=$(`[name="${name}"]`);if(!dpTarget)return;const selected=jparse(dpTarget.value)||isoToday();dpMonth=jparts(selected);paintDateCalendar();const box=$('#date-popup'),r=dpTarget.getBoundingClientRect(),left=Math.min(window.innerWidth-310,Math.max(8,r.left));box.style.left=left+'px';box.style.top=Math.min(window.innerHeight-365,Math.max(8,r.bottom+5))+'px';box.style.display='block'}
function paintDateCalendar(){const y=dpMonth.y,m=dpMonth.m,len=daysInMonth(y,m),start=wd(fromJ(y,m,1)),c=['<div class="datecal-week">'+DW.map(x=>`<span>${x.slice(0,1)}</span>`).join('')+'</div>','<div class="datecal-grid">'];for(let i=0;i<start;i++)c.push('<i></i>');for(let n=1;n<=len;n++)c.push(`<button data-pick="${fromJ(y,m,n)}">${toFa(n)}</button>`);c.push('</div>');$('#date-popup').innerHTML=`<div class="datecal-head"><button data-shift="-1">‹</button><b>${M[m-1]} ${toFa(y)}</b><button data-shift="1">›</button></div>${c.join('')}<button class="datecal-today" data-pick="${isoToday()}">امروز · ${jstr(isoToday())}</button>`}
$('#date-popup').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(b.dataset.shift){let m=dpMonth.m+(+b.dataset.shift);if(m<1){dpMonth.y--;m=12}if(m>12){dpMonth.y++;m=1}dpMonth.m=m;paintDateCalendar()}if(b.dataset.pick){if(dpTarget)dpTarget.value=jstr(b.dataset.pick);$('#date-popup').style.display='none'}});
generateDue();render();
</script></body></html>
